{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width:450px; margin:60px auto;">
  <h2 style="margin-bottom:25px; text-align:center;">LOGIN</h2>
  <form method="post">
    <input type="email" name="email" placeholder="Email" required style="width:100%; margin-bottom:12px;">
    <input type="password" name="password" placeholder="Password" required style="width:100%; margin-bottom:20px;">
    <button class="btn solid" type="submit" style="width:100%;">Log In</button>
  </form>
  <p style="margin-top:20px; text-align:center; font-size:13px;">No account? <a href="{{ url_for('register') }}">Register</a> or <a href="{{ url_for('checkout') }}">check out as guest</a>.</p>
</div>
{% endblock %}
